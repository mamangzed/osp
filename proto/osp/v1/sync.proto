syntax = "proto3";
package osp.v1;

import "osp/v1/common.proto";

message Subscribe {
  string subscription_id = 1; // client-generated
  string collection = 2;
  Predicate predicate = 3;
  uint32 limit = 4;       // 0 = unlimited
  bool with_snapshot = 5; // request latest snapshot on subscribe
}

message Unsubscribe {
  string subscription_id = 1;
}

message SubscribeAck {
  string subscription_id = 1;
  bool accepted = 2;
  ErrorInfo error = 3;
  uint64 snapshot_revision = 4; // valid if with_snapshot && accepted
}

message Predicate {
  oneof kind {
    Eq eq = 1;
    Ne ne = 2;
    Lt lt = 3;
    Le le = 4;
    Gt gt = 5;
    Ge ge = 6;
    InExpr in_expr = 7;
    AndExpr and_expr = 8;
    OrExpr or_expr = 9;
    NotExpr not_expr = 10;
  }
  message Eq       { string field = 1; Value value = 2; }
  message Ne       { string field = 1; Value value = 2; }
  message Lt       { string field = 1; Value value = 2; }
  message Le       { string field = 1; Value value = 2; }
  message Gt       { string field = 1; Value value = 2; }
  message Ge       { string field = 1; Value value = 2; }
  message InExpr   { string field = 1; repeated Value values = 2; }
  message AndExpr  { repeated Predicate children = 1; }
  message OrExpr   { repeated Predicate children = 1; }
  message NotExpr  { Predicate child = 1; }
}

message Operation {
  string op_id = 1;       // UUIDv7
  string device_id = 2;
  uint64 lamport = 3;
  string collection = 4;
  string record_id = 5;
  OpKind kind = 6;
  repeated FieldChange field_changes = 7;
  VClock base_clock = 8;  // vector clock observed by writer when generating
  uint64 timestamp_ms = 9;
}

enum OpKind {
  OP_KIND_UNSPECIFIED = 0;
  OP_KIND_INSERT = 1;
  OP_KIND_UPDATE = 2;
  OP_KIND_DELETE = 3;
  OP_KIND_RESTORE = 4;
}

message Record {
  string collection = 1;
  string record_id = 2;
  uint64 revision = 3;
  VClock vector_clock = 4;
  bool tombstone = 5;
  map<string, Value> fields = 6;
  map<string, FieldMeta> field_meta = 7;
  uint64 updated_at_ms = 8;
}

message FieldMeta {
  uint64 lamport = 1;
  string writer_device_id = 2;
}

message Snapshot {
  string collection = 1;
  uint64 revision = 2;
  uint64 lamport_floor = 3; // op_log_since(this) needed after snapshot
  repeated Record records = 4;
}

message OpAck {
  string op_id = 1;
  bool accepted = 2;
  ErrorInfo error = 3;
  uint64 revision = 4; // server-assigned revision, valid if accepted && kind != Delete
}

message SyncPush {
  // Server → client: a batch of ops, possibly across collections
  repeated Operation ops = 1;
}

message SyncPullRequest {
  string collection = 1;
  uint64 since_lamport = 2;
  uint32 max_ops = 3;
}

message SyncPullResponse {
  string collection = 1;
  uint64 since_lamport = 2;
  repeated Operation ops = 3;
  bool has_more = 4;
}

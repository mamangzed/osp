[package]
name = "owl-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OSP server runtime. Single-process TCP server with SQLite + memory storage."

[[bin]]
name = "owl-server"
path = "src/main.rs"

[lib]
name = "owl_server"
path = "src/lib.rs"

[dependencies]
owl-types = { workspace = true }
owl-sync = { workspace = true }
owl-storage = { workspace = true }
owl-auth = { workspace = true }
owl-protocol = { workspace = true }
owl-transport = { workspace = true, features = ["websocket"] }
owl-query = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
rand = "0.8"
futures = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
jsonwebtoken = "9.2"

[features]
default = ["websocket"]
websocket = ["owl-transport/websocket"]
